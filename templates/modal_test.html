<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background: #f5f5f5;
        }
        
        .button {
            padding: 10px 20px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .button:hover {
            background: #4f46e5;
        }
        
        /* Modal Styles */
        #testModal {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.2s, visibility 0.2s;
        }
        
        #testModal.active {
            visibility: visible;
            opacity: 1;
        }
        
        .modal-content {
            background: white;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
        
        .modal-header {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        
        .modal-body {
            font-size: 16px;
            margin-bottom: 20px;
            color: #666;
        }
        
        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
    </style>
</head>
<body>
    <h1>Modal Test Page</h1>
    <p>이 페이지는 모달이 화면 중앙에 올바르게 표시되는지 테스트합니다.</p>
    
    <button class="button" onclick="openModal()">모달 열기</button>
    <button class="button" onclick="closeModal()">모달 닫기</button>
    
    <!-- Test Modal -->
    <div id="testModal">
        <div class="modal-content">
            <div class="modal-header">✅ 테스트 모달</div>
            <div class="modal-body">
                모달이 화면 정중앙에 표시되면 성공입니다!<br>
                (만약 왼쪽 위에 보인다면 CSS에 문제가 있습니다)
            </div>
            <div class="modal-footer">
                <button class="button" onclick="closeModal()">닫기</button>
            </div>
        </div>
    </div>
    
    <script>
        function openModal() {
            console.log('Opening modal...');
            const modal = document.getElementById('testModal');
            modal.classList.add('active');
        }
        
        function closeModal() {
            console.log('Closing modal...');
            const modal = document.getElementById('testModal');
            modal.classList.remove('active');
        }
        
        // 모달 외부 클릭 시 닫기
        document.addEventListener('click', function(event) {
            const modal = document.getElementById('testModal');
            if (event.target === modal) {
                closeModal();
            }
        });
    </script>
</body>
</html>
